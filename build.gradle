plugins {
    id 'base'
    id 'com.diffplug.spotless' version '7.2.1' apply false
}

subprojects {
    pluginManager.withPlugin('java') {
        apply plugin: 'com.diffplug.spotless'
        apply plugin: 'pmd'

        pmd {
            toolVersion = '7.17.0'
            ruleSets = []
            ruleSetFiles = rootProject.files('config/pmd/ruleset.xml')
            ignoreFailures = false
            consoleOutput = true
        }

        tasks.withType(Pmd).configureEach {
            reports {
                xml.required = true
                html.required = true
            }
        }

        spotless {
            java {
                target 'src/*/java/**/*.java'
                googleJavaFormat('1.28.0')
            }
        }
    }
}

// Build and verify every lab from the repository root.
tasks.named('build') {
    dependsOn subprojects.collect { "${it.path}:build" }
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs the JUnit tests for every lab.'
    dependsOn subprojects.collect { "${it.path}:test" }
}

tasks.register('pmd') {
    group = 'verification'
    description = 'Runs PMD analysis on main and test sources for every lab.'
    dependsOn subprojects.collect { "${it.path}:pmdMain" }
    dependsOn subprojects.collect { "${it.path}:pmdTest" }
}

tasks.named('check') {
    dependsOn subprojects.collect { "${it.path}:check" }
}

tasks.named('clean') {
    dependsOn subprojects.collect { "${it.path}:clean" }
}
